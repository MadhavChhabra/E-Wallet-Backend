spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.application.name=e-wallet
spring.jpa.open-in-view=false

spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:8080}

app.security.jwtSecret=${APP_SECURITY_JWT_SECRET}
app.security.jwtExpirationMs=${APP_SECURITY_JWT_EXPIRATION_MS:3600000}
app.security.refreshTokenSecret=${APP_SECURITY_REFRESH_TOKEN_SECRET}
app.security.refreshTokenExpirationMs=${APP_SECURITY_REFRESH_TOKEN_EXPIRATION_MS:2629746000}

app.rate-limit.login.max-requests=10
app.rate-limit.transfer.max-requests=30
app.rate-limit.window-seconds=60

app.cache.reference-data.ttl-minutes=60
app.pagination.max-page-size=100

app.reconciliation.enabled=true
app.reconciliation.cron=0 0 2 * * *

# One-click demo account provisioning (for the public showcase). Disable in a
# real production deployment.
app.demo.enabled=${DEMO_ENABLED:true}

# ---------------------------------------------------------------------------
# Password reset (OTP)
# ---------------------------------------------------------------------------
app.password-reset.otp-length=6
app.password-reset.otp-expiry-minutes=10
app.password-reset.max-attempts=5
# When true (dev/test) the generated OTP is written to the application log and
# the response so the flow can be exercised without a real SMTP server.
app.password-reset.expose-otp=${APP_PASSWORD_RESET_EXPOSE_OTP:false}

# ---------------------------------------------------------------------------
# Mail (used for password-reset OTP delivery). Optional in dev.
# ---------------------------------------------------------------------------
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
app.mail.from=${MAIL_FROM:no-reply@ewallet.local}
app.mail.enabled=${MAIL_ENABLED:false}

# ---------------------------------------------------------------------------
# Google OAuth (Sign in with Google). Verifies the client's Google ID token
# server-side against Google's public keys, then issues our own JWTs.
# GOOGLE_CLIENT_ID may be a comma-separated list of accepted audiences
# (e.g. the Android + Web/serverClientId client ids).
# ---------------------------------------------------------------------------
app.oauth.google.enabled=${GOOGLE_OAUTH_ENABLED:false}
app.oauth.google.client-id=${GOOGLE_CLIENT_ID:}

# ---------------------------------------------------------------------------
# File storage (profile / card images)
# app.storage.type = local (default) | s3
# S3 credentials come from the default AWS chain (env vars or EC2 instance role).
# ---------------------------------------------------------------------------
app.storage.type=${APP_STORAGE_TYPE:local}
app.storage.location=${APP_STORAGE_LOCATION:./data/uploads}
app.storage.max-file-size-bytes=5242880
app.storage.s3.bucket=${APP_STORAGE_S3_BUCKET:}
app.storage.s3.region=${APP_STORAGE_S3_REGION:ap-south-1}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ---------------------------------------------------------------------------
# Razorpay (TEST mode). Provide test keys via environment variables.
# Get free test keys at https://dashboard.razorpay.com/app/keys
# key_id is public (safe on the client); key_secret must stay server-side only.
# ---------------------------------------------------------------------------
app.razorpay.enabled=${RAZORPAY_ENABLED:false}
app.razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_xxxxxxxxxxxxxx}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
app.razorpay.currency=${RAZORPAY_CURRENCY:INR}
# Webhook signature secret configured in the Razorpay dashboard (optional).
app.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
# No SMTP server in the default/demo setup — don't let the mail probe fail health.
management.health.mail.enabled=false

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{requestId}] %-5level %logger{36} - %msg%n

exception.trace=false
