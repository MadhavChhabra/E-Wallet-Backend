spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.application.name=e-wallet
spring.jpa.open-in-view=false

spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:8080}

app.security.jwtSecret=${APP_SECURITY_JWT_SECRET}
app.security.jwtExpirationMs=${APP_SECURITY_JWT_EXPIRATION_MS:3600000}
app.security.refreshTokenSecret=${APP_SECURITY_REFRESH_TOKEN_SECRET}
app.security.refreshTokenExpirationMs=${APP_SECURITY_REFRESH_TOKEN_EXPIRATION_MS:2629746000}

app.rate-limit.login.max-requests=10
app.rate-limit.transfer.max-requests=30
app.rate-limit.window-seconds=60

app.cache.reference-data.ttl-minutes=60
app.pagination.max-page-size=100

app.reconciliation.enabled=true
app.reconciliation.cron=0 0 2 * * *

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{requestId}] %-5level %logger{36} - %msg%n

exception.trace=false
