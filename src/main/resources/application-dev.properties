# Load personal overrides from application-local.properties (gitignored) when present.
spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=jdbc:mysql://localhost:3306/ewallet_new
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT secrets must be at least 32 characters for HS256
app.security.jwtSecret=${APP_SECURITY_JWT_SECRET:mySecretKey123!@#mySecretKey123!@#}
app.security.refreshTokenSecret=${APP_SECURITY_REFRESH_TOKEN_SECRET:myRefreshKey456!@#myRefreshKey456!@#}