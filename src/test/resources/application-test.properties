spring.datasource.url=jdbc:h2:mem:ewallet_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

app.security.jwtSecret=testJwtSecretKey123456789012345678901234
app.security.refreshTokenSecret=testRefreshSecretKey123456789012345678901234
app.reconciliation.enabled=false
